    /**

     *  - v2.7.0: Validação completa do dígito verificador do CNPJ (módulo 11)
     *            e botão "Consultar Sintegra do Estado" com mapeamento das 27 SEFAZ.
     *  - v2.8.0: Lista de Atividades Secundárias (CNAEs) agora exibe TODOS os
     *            itens, com opção de expandir/recolher quando houver mais de 5.
     */

    // --- Módulo de Validação ---
    const Validator = {
      /**
       * Valida um CNPJ (14 dígitos) verificando os dois dígitos verificadores
       * pelo algoritmo oficial (módulo 11), além de checar sequências repetidas.
       * @param {string} cnpj - Somente dígitos (14 caracteres).
       * @returns {boolean}
       */
      isValidCnpj(cnpj) {
        if (!cnpj || cnpj.length !== 14) return false;
        if (/^(\d)\1{13}$/.test(cnpj)) return false; // 00000000000000, 11111111111111 etc.

        const calcularDigito = (base) => {
          let pesos = base.length === 12
            ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
            : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
          let soma = 0;
          for (let i = 0; i < base.length; i++) {
            soma += parseInt(base.charAt(i), 10) * pesos[i];
          }
          const resto = soma % 11;
          return resto < 2 ? 0 : 11 - resto;
        };

        const base12 = cnpj.substring(0, 12);
        const digito1 = calcularDigito(base12);
        const base13 = base12 + digito1;
        const digito2 = calcularDigito(base13);

        return cnpj === base13 + digito2;
      }
    };
