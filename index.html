  <script>

        extend: {
          fontFamily: {

            gradient: {

            float: {
              '0%, 100%': { transform: 'translateY(0px)' },

            slideUp: {

  <style>
    /*
      IDENTIDADE VISUAL - Herbert Lemos Assessoria Contábil
      Baseada no logotipo: fundo preto absoluto, elementos em branco/prata,
      detalhe em vermelho (coração da assinatura) e tipografia serifada

    */
    :root {
      --brand-black: #0a0a0a;
      --brand-charcoal: #161616;
      --brand-white: #f5f5f5;
      --brand-silver: #c9c9c9;
      --brand-red: #e11d2e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a 0%, #000000 70%);
      background-attachment: fixed;
      color: var(--brand-white);
    }

    .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15), 0 10px 25px -5px rgba(255, 255, 255, 0.08);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #2b2b2b 0%, #050505 100%);
      border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover:not(:disabled) {
      background: linear-gradient(135deg, #3a3a3a 0%, #101010 100%);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.35);
      transition: all 0.3s ease;
    }
    .btn-outline:hover:not(:disabled) {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-2px);
    }

    .result-item { transition: all 0.2s ease; }
    .result-item:hover { transform: translateX(5px); }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(200, 200, 200, 0.4); border-radius: 20px; }

    .cnae-toggle-link {

      text-decoration: underline;
      font-style: italic;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
